<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f6f2">
<title>Agent Relay</title><style nonce="__CSP_NONCE__">
:root{color-scheme:light;--bg:#f7f6f2;--surface:#fff;--ink:#1a1d21;--muted:#5c636c;--line:#e2e0d8;--accent:#0b6e5f;--accent-dark:#085548;--accent-soft:#e0f2ed;--danger:#b3261e;--danger-soft:#fcecea;--warn:#92400e;--warn-soft:#fdf0d8;--tap:44px;--r:12px;--ease:cubic-bezier(.2,.75,.3,1);--c:#5c636c;--cs:#f1f0ea;--cl:#e2e0d8}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body,#root{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI","SF Arabic","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
.screen{height:100%;display:flex;flex-direction:column;width:100%;max-width:760px;margin-inline:auto;background:var(--bg)}
@supports (height:100dvh){.screen{height:var(--app-h,100dvh)}}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* One colour per agent. Each --c passes AA against white and against its own --cs, and page-check holds it to that. */
.c0{--c:#0b6e5f;--cs:#e6f4f0;--cl:#bfe3d9}
.c1{--c:#1f5fa6;--cs:#e8f0fa;--cl:#c5d9f0}
.c2{--c:#b03a22;--cs:#fbece8;--cl:#f2cfc6}
.c3{--c:#855600;--cs:#fbf2dd;--cl:#eedcae}
.c4{--c:#3a7420;--cs:#edf5e6;--cl:#cfe5bf}
.c5{--c:#b3265a;--cs:#fbe9f0;--cl:#f2c8d8}
.c6{--c:#0a6a8c;--cs:#e4f2f7;--cl:#bddfea}
.c7{--c:#62670f;--cs:#f3f4dd;--cl:#dfe1ae}
.c8{--c:#ab470b;--cs:#fcefe4;--cl:#f3d4bb}
.c9{--c:#44586b;--cs:#edf1f4;--cl:#d0dae2}
.c10{--c:#7a4b2e;--cs:#f6eee8;--cl:#e4d2c5}
.c11{--c:#25457a;--cs:#e9edf6;--cl:#c8d3e8}
.av{flex:none;display:block}
.av circle{fill:var(--c)}
.av text{fill:#fff;font-family:inherit;font-size:15px;font-weight:700}
.av text.two{font-size:12px}
.nm{color:var(--c);font-weight:600}
.ag{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;max-width:100%;min-width:0}
.ag .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Controls. 16px text keeps iOS from zooming the page on focus. */
button,input,textarea{font:inherit;color:inherit;border-radius:var(--r)}
input,textarea{width:100%;min-height:var(--tap);background:var(--surface);border:1px solid var(--line);padding:9px 12px;font-size:16px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea{display:block;resize:none;line-height:1.5}
label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
button{min-height:var(--tap);padding:0 16px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background-color .15s,border-color .15s,color .15s,transform .15s}
button:active{transform:scale(.98);background:var(--bg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default;transform:none}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:active{background:var(--accent-dark)}
button.approve{background:var(--accent);border-color:var(--accent);color:#fff;min-height:52px;font-size:17px}
button.approve:active{background:var(--accent-dark)}
button.reject{background:var(--surface);border-color:var(--danger);color:var(--danger);min-height:52px;font-size:17px}
button.reject:active{background:var(--danger-soft)}
button.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:0 10px}
button.quiet:active{background:var(--line)}
@media (hover:hover){button:hover:not(:disabled){background:var(--bg)}button.primary:hover:not(:disabled),button.approve:hover:not(:disabled){background:var(--accent-dark)}button.reject:hover:not(:disabled){background:var(--danger-soft)}button.quiet:hover:not(:disabled){background:var(--line)}}

/* Login */
#login-view,#boot{justify-content:center;padding:24px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left))}
#login-view h1,#boot h1{margin:0;font-size:28px;line-height:1.2;direction:ltr;text-align:end;letter-spacing:-.01em}
#login-view p,#boot p{margin:6px 0 24px;color:var(--muted)}
#login-view p.msg{margin:12px 0 0;color:var(--danger)}
#key{direction:ltr;margin-bottom:12px}
#login{width:100%;min-height:52px;font-size:17px}

/* Header and tabs */
header{display:flex;align-items:center;gap:8px;padding:max(6px,env(safe-area-inset-top)) 16px 6px;min-height:52px}
header b{font-size:17px;direction:ltr;letter-spacing:-.01em}
#who{margin-inline-start:auto;font-size:14px;max-width:45%;display:flex;min-width:0}
nav{display:flex;border-bottom:1px solid var(--line);padding-inline:8px}
nav button{flex:1;min-height:50px;padding:0 4px;border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
nav button:active{transform:none;background:transparent}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
@media (hover:hover){nav button:hover:not(:disabled){background:transparent;color:var(--ink)}}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--danger);color:#fff;font-size:13px;line-height:22px;text-align:center}
#net{background:var(--warn-soft);color:var(--warn);font-size:14px;padding:6px 16px}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;animation:panel-in .2s var(--ease)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 16px}
.empty{color:var(--muted);text-align:center;margin:40px 16px}
.msg{font-size:14px;color:var(--danger);margin:0;padding:0 2px}
.msg:empty{display:none}

/* Chat. The page is RTL, so a row starts on the right and a reversed row starts on the left. */
#log{display:flex;flex-direction:column;gap:16px}
.m{display:flex;align-items:flex-start;gap:8px}
.m.mine{flex-direction:row}
.m.other{flex-direction:row-reverse}
.m.enter{animation:bubble-in .22s var(--ease) both}
.mc{min-width:0;max-width:min(84%,600px);display:flex;flex-direction:column}
.mine .mc{align-items:flex-start}
.other .mc{align-items:flex-end}
.m .h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted);line-height:1.3;min-height:20px;margin-bottom:4px;padding-inline:2px}
.m .h .t{white-space:nowrap}
.w .nm{font-weight:700;font-size:14px}
.bw{display:flex;align-items:flex-end;gap:6px;max-width:100%;min-width:0}
.other .bw{flex-direction:row-reverse}
.bb{min-width:0;background:var(--cs);border:1px solid var(--cl);border-radius:16px;padding:10px 14px}
.mine .bb{border-start-start-radius:4px}
.other .bb{border-start-end-radius:4px}
.b{font-size:16px;line-height:1.7}
/* Small to the eye, and an invisible layer brings the tap area up to 44px. */
.tapx{position:relative}
.tapx::after{content:"";position:absolute;inset:-8px -4px}
.m button.copy{min-height:0;padding:0 6px;font-size:13px;font-weight:500;line-height:1.5}
button.rep{flex:none;min-height:30px;min-width:40px;padding:0 9px;border-radius:15px;border-color:var(--cl);background:var(--surface);color:var(--c);font-size:14px;font-weight:700;direction:ltr;animation:rep-in .2s var(--ease)}
button.rep[aria-expanded=true]{background:var(--c);border-color:var(--c);color:#fff}
.ok{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;padding-inline:2px;font-size:13px;color:var(--muted)}
.ok .tick{color:var(--accent);font-weight:700}
.copies{list-style:none;margin:6px 0 0;padding:6px 10px;background:var(--surface);border:1px solid var(--cl);border-radius:12px;font-size:13px;color:var(--muted);align-self:stretch;animation:panel-in .18s var(--ease)}
.copies li{display:flex;align-items:center;gap:8px;min-height:28px;flex-wrap:wrap}
.copies .ct{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
#jump{position:absolute;bottom:8px;inset-inline-start:50%;transform:translateX(50%);min-height:40px;border-radius:20px;background:var(--ink);border-color:var(--ink);color:#fff;font-size:14px;z-index:1;animation:toast-in .2s var(--ease)}
#jump:active{transform:translateX(50%);background:var(--ink)}
#chat .stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#bar{border-top:2px solid var(--c);background:var(--surface);padding:8px 12px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;transition:border-color .18s}
#bar .to{display:flex;align-items:center;gap:8px}
#bar .to>label{margin:0;color:var(--muted);font-weight:500}
#bar .write{display:flex;align-items:flex-end;gap:8px}
#txt{flex:1;width:auto;min-width:0;max-height:132px;overflow-y:auto;background:var(--bg);border-color:var(--cl);unicode-bidi:plaintext;transition:border-color .18s}
#txt:focus{outline-color:var(--c);border-color:var(--c)}
#send{flex:none;padding:0 20px}
.hints{display:flex;flex-wrap:wrap;gap:6px;animation:panel-in .16s var(--ease)}
button.hint{min-height:36px;padding:0 10px 0 6px;border-radius:18px;background:var(--cs);border-color:var(--cl);font-weight:500}

/* Rendered Markdown. Each block sets its own direction, so Arabic and English paragraphs sit side by side. */
.md{overflow-wrap:anywhere;min-width:0}
.md.plain{white-space:pre-wrap;unicode-bidi:plaintext}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md p{margin:0 0 .6em}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:.9em 0 .4em;line-height:1.35;font-weight:700}
.md h1{font-size:1.32em}
.md h2{font-size:1.2em}
.md h3{font-size:1.08em}
.md h4,.md h5,.md h6{font-size:1em}
/* Both sides, because an English item in an Arabic list puts its marker on the far side. */
.md ul,.md ol{margin:0 0 .6em;padding-inline:1.4em}
.md li+li{margin-top:.2em}
.md blockquote{margin:0 0 .6em;padding-inline-start:.8em;border-inline-start:3px solid var(--line);color:var(--muted)}
.md a{color:var(--accent-dark);text-decoration:underline;text-underline-offset:2px}
.md hr{border:0;border-top:1px solid var(--line);margin:.9em 0}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:rgba(26,29,33,.07);border-radius:5px;padding:.1em .35em}
.md pre{margin:0 0 .6em;padding:10px 12px;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:10px;overflow-x:auto;text-align:left;line-height:1.5}
.md pre code{display:block;background:transparent;padding:0;font-size:.88em;white-space:pre;overflow-wrap:normal}
.md .tw{overflow-x:auto;margin:0 0 .6em}
.md table{border-collapse:collapse;font-size:.94em}
/* Without this a narrow table squeezes words down to one letter per line instead of scrolling. */
.md th,.md td{border:1px solid var(--line);padding:6px 10px;overflow-wrap:normal;min-width:5ch}
.md th:not([align]),.md td:not([align]){text-align:start}
.md th{background:rgba(26,29,33,.04);font-weight:700}
button.rawbtn{min-height:0;margin-top:6px;padding:0 4px;border:0;background:transparent;color:var(--warn);font-size:13px;font-weight:500;line-height:1.5}

/* Combobox: the one list control on this page */
.cb{position:relative;flex:1;min-width:0}
button.cb-t{width:100%;display:flex;align-items:center;gap:8px;padding:0 10px;text-align:start;font-weight:500;background:var(--bg)}
button.cb-t:active{transform:none}
.cb-v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-t.tone .cb-v{color:var(--c);font-weight:600}
.cb-c{flex:none;color:var(--muted);transition:transform .18s var(--ease)}
.cb-t[aria-expanded=true] .cb-c{transform:rotate(180deg)}
.cb-p{position:absolute;inset-inline:0;z-index:4;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(26,29,33,.14);overflow:hidden;animation:cb-in .16s var(--ease) both}
.cb-p.dn{top:calc(100% + 6px);transform-origin:top}
.cb-p.up{bottom:calc(100% + 6px);transform-origin:bottom}
.cb-p.out{animation:cb-out .15s ease-in both;pointer-events:none}
input.cb-s{flex:none;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--surface)}
input.cb-s:focus{outline:0;border-color:var(--accent)}
.cb-l{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px;position:relative}
.cb-o{display:flex;align-items:center;gap:10px;min-height:var(--tap);padding:6px 10px;border-radius:10px;cursor:pointer;transition:background-color .15s}
.cb-o.on{background:var(--accent-soft)}
.cb-o[aria-selected=true] .cb-ol{font-weight:700}
.cb-o[aria-disabled=true]{opacity:.45;cursor:default}
.cb-o[aria-disabled=true].on{background:var(--bg)}
.cb-ol{min-width:0;overflow-wrap:anywhere}
.cb-o.tone .cb-ol{color:var(--c);font-weight:600}
.cb-h{display:block;font-size:13px;color:var(--muted);font-weight:400;overflow-wrap:anywhere}
.cb-k{margin-inline-start:auto;color:var(--accent);font-weight:700}
.cb-none{padding:12px;text-align:center;color:var(--muted);font-size:14px}

/* Wiki */
#wbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
#wbar .wide{grid-column:1/-1}
#wbar .cb{flex:none}
#wsearch{display:flex;gap:8px}
#wq{flex:1;width:auto;min-width:0}
#wnew{flex:none;padding:0 12px}
#wlist{display:flex;flex-direction:column;gap:8px;transition:opacity .15s}
#wlist.busy{opacity:.55}
button.wi{display:block;width:100%;min-height:60px;padding:10px 14px;text-align:start;font-weight:400;line-height:1.45}
.wi .t{display:block;font-weight:600;overflow-wrap:anywhere}
.wi .d{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.wi .by{display:block;margin-top:4px;font-size:13px}
#wquota{font-size:13px;color:var(--muted);text-align:center;margin:14px 0 2px}
#wmsg{margin-bottom:10px}
#wmsg.info{color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .end{margin-inline-start:auto}
#wtitle{margin:12px 0 6px;font-size:22px;line-height:1.3;overflow-wrap:anywhere}
.chip{display:inline-block;background:var(--line);border-radius:7px;padding:1px 8px;margin-inline-end:4px;margin-bottom:4px;font-size:13px}
.chip.badge2{background:var(--warn-soft);color:var(--warn)}
#wmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
#wbody{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0 0;font-size:16px;line-height:1.75}
#whistbox{margin-top:14px}
#wform{display:flex;flex-direction:column;gap:12px}
#fbody{min-height:40dvh;resize:vertical;unicode-bidi:plaintext}
#fslug{direction:ltr}
#fslug:disabled{background:var(--bg);color:var(--muted)}
#wform .acts{display:flex;gap:8px;position:sticky;bottom:-12px;background:var(--bg);padding:8px 0 12px}
#wform .acts button{flex:1}

/* Approvals */
.task{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;animation:bubble-in .22s var(--ease) both}
.task .ty{font-size:18px;font-weight:700;direction:ltr;text-align:end;overflow-wrap:anywhere}
.task .wh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:14px;color:var(--muted);margin:2px 0 8px;overflow-wrap:anywhere}
.task pre{direction:ltr;text-align:left;background:var(--bg);border-radius:8px;padding:10px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.task .sha{direction:ltr;text-align:left;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.task .acts{display:flex;gap:8px;margin-top:12px}
.agent-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.agent-row .grow{flex:1;min-width:0}
.agent-row .st{font-size:12px;color:var(--muted)}
.agent-row.revoked{opacity:.55}
#agform{display:flex;gap:8px;margin:4px 0 14px}
#agform input{flex:1;min-width:0}
.akey{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.akey code{display:block;word-break:break-all;direction:ltr;text-align:left;margin:8px 0;font-size:13px}
.akey .warn{color:var(--muted);font-size:13px}
.task .acts button{flex:1;padding:0 8px}
.task .q{font-weight:600;margin:12px 0 0}
.task .msg{margin-top:8px}

/* Skeleton */
.sk{display:block;background:linear-gradient(90deg,#ebe9e1 25%,#f4f3ed 50%,#ebe9e1 75%);background-size:300% 100%;border-radius:10px;animation:shimmer 1.4s linear infinite}
.sk-chat{display:flex;flex-direction:column;gap:18px}
.sk-m{display:flex;gap:8px;align-items:flex-start;flex-direction:row-reverse}
.sk-m.r{flex-direction:row}
.sk-a{flex:none;width:34px;height:34px;border-radius:50%}
.sk-b{height:56px;width:58%}
.sk-m.r .sk-b{width:44%;height:40px}
.sk-cards{display:flex;flex-direction:column;gap:8px}
.sk-c{height:74px}
.sk-lines{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sk-l{height:16px}
.sk-l.t{height:26px;width:60%}
.sk-l.s{width:72%}

/* Toast */
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 8px);inset-inline:16px;margin-inline:auto;max-width:440px;background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500;z-index:5;animation:toast-in .2s var(--ease)}
#toast:active{background:var(--ink)}
@media (hover:hover){#toast:hover:not(:disabled){background:var(--ink)}}
.offscreen{position:fixed;top:0;inset-inline-start:-9999px;font-size:16px}

@keyframes panel-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes bubble-in{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes rep-in{from{transform:scale(.8)}to{transform:none}}
@keyframes toast-in{from{opacity:0}to{opacity:1}}
@keyframes cb-in{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes cb-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-3px) scale(.985)}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}button:active{transform:none}}
</style></head><body>

<div id="root"><main id="boot" class="screen"><h1>Agent Relay</h1><p id="boot-msg" role="status">جارٍ التحميل…</p></main></div>

<script src="https://cdn.jsdelivr.net/npm/preact@10.29.8/dist/preact.min.umd.js" integrity="sha384-cOwCaAX2ppa31h4bKHnDnBRnVt8enjF3cuzM5lyB+rsbmCFPpEMQ9ON4GsRbTdd1" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/preact@10.29.8/hooks/dist/hooks.umd.js" integrity="sha384-5BuvBL8F0gboRla2VFizWuUXbA44J2dFYJZZGhPD7/8zlTbKMJAPtgIerv7vIpPw" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js" integrity="sha384-toVdrLSMaw7Y55MowcKqkmFL/Ek6Sky62NOk0b5sDDZBu2wcoPyyQUt9unDVjXhL" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@18.1.2/lib/marked.umd.js" integrity="sha384-nCN5FOaVTXXYilftBH/VQuC9ypBYOxrctAZn2x7ggYClXaporWSzM0y+ODhb8MTi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous"></script>
<script nonce="__CSP_NONCE__">
// External data reaches the DOM only as text through the virtual DOM, or as the sanitized fragment in Markdown(). Do not build markup from strings here.

// ---------- session ----------
async function login(){
  var k=S.keyDraft.trim();
  if(!k){S.loginMsg="أدخل المفتاح أولاً.";up();return;}
  KEY=k;var gen=++GEN;S.loginBusy=true;S.loginMsg="";up();
  var res=await api("GET","/v2/me");
  if(gen!==GEN)return;
  S.loginBusy=false;
  if(!res.ok){
    if(res.status===401)sessionStorage.removeItem("rk");
    KEY="";S.loginMsg=errText(res);up();return;
  }
  sessionStorage.setItem("rk",k);S.keyDraft="";
  S.me=res.data.agent;S.admin=res.data.is_admin;
  applyGrants(res.data);
  S.view="app";showTab("chat");poll();
}

  GEN++;KEY="";after=0;SEEN={};GROUPS=new Map();KNOWN=null;POLLING=false;AGAIN=false;IDEM=null;

}

  if(name==="wiki"&&S.wmode==="list")loadWiki();

function Bubble(p){

function Log(){
  var v=S.logV;

  var rows=useMemo(function(){return S.groups.map(function(g){return html`<${Bubble} key=${g.id} g=${g} n=${g.n}/>`;});},[v]);
  useLayoutEffect(function(){if(S.stick&&S.tab==="chat")toBottom();S.stick=false;},[v]);
  useLayoutEffect(function(){if(S.tab==="chat")toBottom();},[S.tab]);
  function onScroll(e){var b=e.currentTarget;if(S.jump&&b.scrollHeight-b.scrollTop-b.clientHeight<80){S.jump=false;up();}}
  return html`<div class="stage">
    <div id="logbox" class="scroll" onScroll=${onScroll}>

function Composer(){
  var box=useRef(null);
  var addr=parseTo(S.draft);var hints=addr&&!addr.peer?addr.matches:[];var none=!S.recipients.length;
  useLayoutEffect(function(){var t=box.current;t.style.height="auto";t.style.height=Math.min(t.scrollHeight+2,132)+"px";},[S.draft]);
  function onInput(e){
    S.draft=e.target.value;
    var a=parseTo(S.draft);if(a&&a.peer)S.to=a.peer;
    up();
  }
  // With a mouse and keyboard Enter sends. On a touch keyboard it adds a line, and the button sends.
  function onKey(e){if(FINE&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}}
  function complete(v){
    S.draft="to:"+aliases(v)[0]+" "+addr.rest;S.to=v;up();
    box.current.focus();
  }
  return html`<div id="bar" class=${tone(S.to)}>
    <p id="chatmsg" class="msg" role="alert">${S.chatMsg||null}</p>
    <div class="to"><label>إلى</label><${Combobox} id="to" label="المستلم" value=${S.to} options=${S.recipients.map(agentOption)} disabled=${none} placeholder="لا يوجد مستلم" onChange=${function(v){S.to=v;up();}}/></div>
    ${hints.length>0&&html`<div id="tohints" class="hints">${hints.map(function(v){return html`<button type="button" key=${v} class=${"hint "+tone(v)} onClick=${function(){complete(v);}}><${Agent} name=${v} size=${22}/></button>`;})}</div>`}
    <div class="write"><textarea id="txt" ref=${box} rows="1" maxlength="8000" placeholder="اكتب رسالة، أو ابدأ بـ to:name" aria-label="نص الرسالة" dir="auto" value=${S.draft} onInput=${onInput} onKeyDown=${onKey}></textarea><button id="send" class="primary" disabled=${none||S.sending} onClick=${send} onPointerDown=${function(e){e.preventDefault();}}>إرسال</button></div>
  </div>`;
}

var NAME_OK=/^[a-z0-9_-]{1,32}$/;
var AG_RESERVED=["__admin__","__all__","__wiki__"];
async function loadAgents(){

function AgentRow(p){

function AgentsTab(){
  if(!S.admin)return null;

      <input id="agname" class="mono" value=${S.agName} placeholder="اسم-جديد بالإنجليزية مثل my-bot" onInput=${function(e){S.agName=e.target.value;S.agErr="";up();}}/>
      <button class="primary" disabled=${S.agAdding||!S.agName} >${S.agAdding?"…":"إضافة وكيل"}</button>
    </form>
    ${S.agErr?html`<p class="msg" role="alert">${S.agErr}</p>`:null}
    ${S.agents===null?html`<p class="empty">جاري التحميل…</p>`:(S.agents.length===0?html`<p class="empty">لا وكلاء بعد.</p>`:S.agents.map(function(a){return html`<${AgentRow} key=${a.name} a=${a}/>`;}))}

async function addAgent(){
  var name=(S.agName||"").trim().toLowerCase();
  if(!NAME_OK.test(name)||AG_RESERVED.indexOf(name)>=0){S.agErr="الاسم: حروف إنجليزية صغيرة وأرقام و - و _ فقط (حتى 32).";up();return;}
  S.agAdding=true;S.agErr="";up();
  var res=await api("POST","/v2/join",{agent:name});
  S.agAdding=false;
  if(res.ok){S.agName="";S.agKey={agent:name,key:res.data.key};loadAgents();}
  else S.agErr=errText(res,{409:"الاسم مستخدم بالفعل."});
  up();
}

// ---------- approvals ----------
var RISK={low:"خطر منخفض",medium:"خطر متوسط",high:"خطر عالٍ"};
function prettyParams(s){try{return JSON.stringify(JSON.parse(s),null,2);}catch(e){return s;}}
function Task(p){
  var t=p.t;
  // Two taps, on the page itself: some in-app browsers silently refuse confirm().
  var as=useState("");var action=as[0];var bs=useState(false);var ms=useState("");
  async function go(){
    bs[1](true);
    var res=await api("POST","/v2/tasks/"+encodeURIComponent(t.id)+"/"+action,action==="approve"?{params_sha256:t.params_sha256}:{reason:"rejected by admin"});
    bs[1](false);
    if(res.ok)toast(action==="approve"?"تمت الموافقة":"تم الرفض");
    else{as[1]("");ms[1](errText(res,{409:"تعذر التنفيذ: انتهت صلاحية المهمة أو تغيّرت حالتها."}));}
    loadApprovals();
  }
  function ask(a){as[1](a);ms[1]("");}
  return html`<div class="task">
    <div class="ty">${t.type}</div>
    <span class="chip badge2">${RISK[t.risk]||t.risk}</span>
    <div class="wh"><span>من</span><${Agent} name=${t.from_agent}/><span>إلى</span><${Agent} name=${t.to_agent}/><span>· تنتهي ${fmtTime(t.expires_at)}</span></div>
    <pre class="mono">${prettyParams(t.params_json)}</pre>
    <div class="sha mono">sha256: ${t.params_sha256}</div>
    <p class="msg" role="alert">${ms[0]||null}</p>
    <p class="q" hidden=${!action}>${action==="approve"?"تأكيد الموافقة على ":"تأكيد رفض "}${t.type}؟</p>
    <div class="acts" hidden=${!!action}><button class="approve" onClick=${function(){ask("approve");}}>موافقة</button><button class="reject" onClick=${function(){ask("reject");}}>رفض</button></div>
    <div class="acts" hidden=${!action}><button class=${action==="approve"?"approve":"reject"} disabled=${bs[0]} onClick=${go}>${action==="approve"?"نعم، موافقة":"نعم، رفض"}</button><button disabled=${bs[0]} onClick=${function(){as[1]("");}}>تراجع</button></div>
  </div>`;
}
async function loadApprovals(){
  if(!S.admin)return;
  var gen=GEN;var res=await api("GET","/v2/tasks?status=awaiting_approval");
  if(gen!==GEN||!res.ok)return;
  // The hourly alarm closes expired tasks, so one can still be listed after approving it became impossible.
  var now=Date.now();var tasks=res.data.tasks.filter(function(t){return t.expires_at>now;});
  var ids=tasks.map(function(t){return t.id;});
  var known=KNOWN||[];
  var fresh=ids.filter(function(id){return known.indexOf(id)<0;});
  KNOWN=ids;S.tasks=tasks;
  document.title=ids.length?"("+ids.length+") Agent Relay":"Agent Relay";
  if(fresh.length&&S.tab!=="approvals")toast(fresh.length===1?"مهمة جديدة بانتظار موافقتك. اضغط لفتحها.":fresh.length+" مهام بانتظار موافقتك. اضغط لفتحها.",function(){showTab("approvals");});
  up();
}

// ---------- wiki ----------
var WK={skill:"مهارة",context:"سياق",note:"ملاحظة"};var EDITING=false;
var SLUG_RE=/^[a-z0-9][a-z0-9_-]{0,63}$/;
var KIND_FILTER=[{value:"",label:"كل الأنواع"},{value:"skill",label:WK.skill},{value:"context",label:WK.context},{value:"note",label:WK.note}];
function wikiShow(mode){
  S.wmode=mode;wikiMsg("");
  var b=$("wscroll");if(b)b.scrollTop=0;
}
function wikiMsg(t,info){S.wmsg=t;S.winfo=!!info;}
var WIKI_ERRORS={400:"راجع الحقول: العنوان حتى 200 حرف، وحتى 8 وسوم بطول 30 حرفاً.",403:"ما عندك صلاحية لتعديل هذا النوع من الصفحات.",413:"الصفحة أكبر من 100KB أو حصة الويكي امتلأت.",422:"مرفوض: النص يشبه سراً. لا تضع أسراراً في الويكي.",429:"تجاوزت حد الكتابة في الساعة. جرّب لاحقاً."};
function wikiFail(res){wikiMsg(errText(res,WIKI_ERRORS));up();}
async function loadWiki(){
  var seq=++wikiSeq;S.wloading=true;up();
  var res=await api("GET","/v2/wiki?kind="+encodeURIComponent(S.wkind)+"&q="+encodeURIComponent(S.wq)+(S.wtag?"&tag="+encodeURIComponent(S.wtag):""));
  if(seq!==wikiSeq||!KEY)return;
  S.wloading=false;
  if(!res.ok){wikiFail(res);return;}
  wikiMsg(res.data.pages.length?"":"لا توجد صفحات.",true);
  S.wpages=res.data.pages;S.wquota=res.data.quota;
  // Kept across filters: a list narrowed to one tag must still offer the others.
  res.data.pages.forEach(function(p){p.tags.forEach(function(t){if(S.wtags.indexOf(t)<0)S.wtags=S.wtags.concat(t).sort();});});
  up();
}
function pageMeta(version,by,at,body,old){return {version:version,by:by,at:at,body:body,old:!!old};}
async function openPage(slug){
  var seq=++pageSeq;var gen=GEN;S.pageLoading=true;S.page=null;S.shown=null;S.versions=null;S.hist=[];wikiShow("view");up();
  var res=await api("GET","/v2/wiki/"+encodeURIComponent(slug));
  if(seq!==pageSeq||gen!==GEN)return;
  S.pageLoading=false;
  if(!res.ok){wikiShow("list");wikiFail(res);return;}
  var p=res.data;S.page=p;S.shown=pageMeta(p.version,p.updated_by,p.updated_at,p.body);up();
  if(S.admin)loadHistory(p);
}
async function loadHistory(p){
  var res=await api("GET","/v2/wiki/"+encodeURIComponent(p.slug)+"/history");
  if(!res.ok||!S.page||S.page.slug!==p.slug)return;
  S.versions=res.data.total+1;S.hist=res.data.versions;up();
}
function showCurrent(){var p=S.page;S.shown=pageMeta(p.version,p.updated_by,p.updated_at,p.body);wikiMsg("");up();}
async function showVersion(p,version){
  var res=await api("GET","/v2/wiki/"+encodeURIComponent(p.slug)+"/history/"+version);
  if(!res.ok){wikiFail(res);return;}
  S.shown=pageMeta(version,res.data.updated_by,res.data.updated_at,res.data.body,true);
  wikiMsg("تعرض نسخة قديمة. التحرير يبدأ دائماً من النسخة الحالية.",true);
  var b=$("wscroll");if(b)b.scrollTop=0;
  up();
}
function openForm(p){
  EDITING=!!p;wikiShow("form");
  S.form={slug:p?p.slug:"",title:p?p.title:"",kind:p?p.kind:"note",tags:p?p.tags.join(", "):"",body:p?p.body:""};
  up();
}
async function saveWiki(){
  var F=S.form;var slug=F.slug.trim();var title=F.title.trim();var text=F.body;
  var tags=F.tags.split(/[,،]/).map(function(t){return t.trim();}).filter(Boolean);
  function stop(t){wikiMsg(t);up();}
  if(!SLUG_RE.test(slug))return stop("المعرّف يبدأ بحرف إنجليزي صغير أو رقم، وفيه فقط a-z و0-9 و- و_.");
  if(!title)return stop("العنوان مطلوب.");
  if(!text.trim())return stop("النص مطلوب.");
  if(tags.length>8)return stop("الحد 8 وسوم.");
  var gen=GEN;S.saving=true;wikiMsg("");up();
  // if_version makes the server refuse instead of replacing a page someone else just wrote.
  var res=await api("PUT","/v2/wiki/"+encodeURIComponent(slug),{title:title,kind:F.kind,body:text,tags:tags,if_version:EDITING?S.page.version:0});
  if(gen!==GEN)return;
  S.saving=false;
  if(res.status===409)return stop(EDITING?"تغيّرت الصفحة أثناء تحريرك. انسخ نصك، ثم ارجع وافتحها من جديد.":"هذا المعرّف مستخدم. افتح الصفحة وحرّرها، أو اختر معرّفاً آخر.");
  if(!res.ok){wikiFail(res);return;}
  await openPage(slug);
}
function WikiItem(p){

}

      <${Combobox} id="wpage" class="wide" label="الصفحة" value="" placeholder="انتقل إلى صفحة…" options=${(pages||[]).map(function(p){return {value:p.slug,label:p.title,hint:p.slug};})} onChange=${openPage}/>
    </div>
    ${on&&S.wloading&&!pages&&html`<${Skeleton} kind="cards"/>`}
    <div id="wlist" class=${S.wloading&&pages?"busy":""} hidden=${!on} aria-busy=${S.wloading?"true":"false"}>${rows}</div>
    <p id="wquota" hidden=${!on||!q}>${q?q.pages+" صفحة · "+fmtBytes(q.bytes)+" من "+fmtBytes(q.max_bytes):null}</p>`;
}
function WikiView(){

    <input id="key" type="password" autocomplete="current-password" autocapitalize="off" spellcheck=${false} enterkeyhint="go" value=${S.keyDraft} onInput=${function(e){S.keyDraft=e.target.value;}} onKeyDown=${function(e){if(e.key==="Enter")login();}}/>
    <button id="login" class="primary" disabled=${S.loginBusy} onClick=${login}>دخول</button>
    <p id="login-msg" class="msg" role="alert">${S.loginMsg||null}</p>
  </main>`;
}
function Badge(p){return html`<span id=${p.id} class="badge" hidden=${!p.n}>${p.n}</span>`;}
function App(){
  bump=useState(0)[1];
  var count=S.tasks.length;
  return html`${S.view==="login"?html`<${Login}/>`:html`<div id="app-view" class="screen">
    <header><b>Agent Relay</b><span id="who"><${Agent} name=${S.me} size=${24}/></span><button id="logout" class="quiet" onClick=${function(){logout();}}>خروج</button></header>
    <nav role="tablist" aria-label="الأقسام">
      <button id="tab-chat" role="tab" aria-controls="chat" aria-selected=${S.tab==="chat"?"true":"false"} onClick=${function(){showTab("chat");}}>شات <${Badge} id="badge-chat" n=${S.unread}/></button>
      <button id="tab-wiki" role="tab" aria-controls="wiki" aria-selected=${S.tab==="wiki"?"true":"false"} onClick=${function(){showTab("wiki");}}>ويكي</button>
      <button id="tab-approvals" role="tab" aria-controls="approvals" aria-selected=${S.tab==="approvals"?"true":"false"} hidden=${!S.admin} onClick=${function(){showTab("approvals");}}>موافقات <${Badge} id="badge-approvals" n=${count}/></button>
      <button id="tab-agents" role="tab" aria-controls="agents" aria-selected=${S.tab==="agents"?"true":"false"} hidden=${!S.admin} onClick=${function(){showTab("agents");}}>وكلاء</button>
    </nav>
    <div id="net" role="status" hidden=${!S.net}>تعذر الاتصال. تجري إعادة المحاولة…</div>
    <section id="chat" class="panel" role="tabpanel" aria-labelledby="tab-chat" hidden=${S.tab!=="chat"}><${Log}/><${Composer}/></section>
    <section id="wiki" class="panel" role="tabpanel" aria-labelledby="tab-wiki" hidden=${S.tab!=="wiki"}>
      <div id="wscroll" class="scroll">
        <div id="wmsg" class=${S.winfo?"msg info":"msg"} role="status">${S.wmsg||null}</div>
        <${WikiList}/><${WikiView}/><${WikiForm}/>
      </div>
    </section>
    <section id="approvals" class="panel" role="tabpanel" aria-labelledby="tab-approvals" hidden=${S.tab!=="approvals"}>
      <div class="scroll"><p id="aplempty" class="empty" hidden=${count>0}>لا توجد مهام بانتظار موافقتك.</p><div id="apl">${S.tasks.map(function(t){return html`<${Task} key=${t.id} t=${t}/>`;})}</div></div>
    </section>
    <section id="agents" class="panel" role="tabpanel" aria-labelledby="tab-agents" hidden=${S.tab!=="agents"}>
      <${AgentsTab}/>
    </section>
  </div>`}
  <button id="toast" role="status" hidden=${!S.toast} onClick=${function(){var t=S.toast;S.toast=null;up();if(t&&t.onTap)t.onTap();}}>${S.toast?S.toast.text:null}</button>`;
}
function start(){
  var root=$("root");root.replaceChildren();preact.render(html`<${App}/>`,root);
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&KEY&&S.me){refreshGrants();poll();}});
  window.addEventListener("online",function(){if(KEY&&S.me)poll();});
  // iOS Safari keeps the layout viewport when the keyboard opens, so the page follows the visual one instead.
  if(window.visualViewport){
    var fitViewport=function(){
      var v=window.visualViewport;if(v.scale>1.01)return;
      document.documentElement.style.setProperty("--app-h",v.height+"px");window.scrollTo(0,0);
    };
    window.visualViewport.addEventListener("resize",fitViewport);
    window.visualViewport.addEventListener("scroll",fitViewport);
  }
  if(KEY)login();
}
if(READY)start();
else $("boot-msg").textContent="تعذر تحميل مكتبات الواجهة من الشبكة. تحقق من الاتصال ثم أعد تحميل الصفحة.";
</script></body></html>
